<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>房东的猫 · 自然生长13周年抽奖</title>
  <style>
    :root{
      --sky:#9bd1e8;--sky-2:#6db7d8;--cream:#fffce5;--leaf:#9cc781;
      --meadow:#153f35;--deep:#061e25;--ink:#082a34;--gold:#e9d8a2;
      --line:rgba(205,242,245,.18);--glass:rgba(7,42,48,.68)
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061f28;color:#f6fff8;font-family:"PingFang SC","苹方-简","Microsoft YaHei",sans-serif}
    button{font:inherit}
    .app{position:relative;width:100vw;height:100vh;min-width:1180px;min-height:720px;overflow:hidden;isolation:isolate;background:linear-gradient(135deg,#6db4d1 0%,#377d91 28%,#123f44 58%,#061f25 100%)}
    .ambient{position:absolute;inset:-6%;z-index:-4;background-image:var(--poster);background-position:center 30%;background-size:cover;filter:blur(34px) saturate(.78) brightness(.55);transform:scale(1.12);opacity:.58}
    .veil{position:absolute;inset:0;z-index:-3;background:radial-gradient(ellipse at 25% 24%,rgba(212,245,255,.22),transparent 31%),radial-gradient(ellipse at 82% 68%,rgba(126,172,102,.13),transparent 31%),linear-gradient(90deg,rgba(2,24,31,.16) 0%,rgba(4,30,34,.44) 38%,rgba(2,18,24,.94) 100%)}
    .grain{position:absolute;inset:0;z-index:-2;opacity:.07;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.72' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.72'/%3E%3C/svg%3E")}
    .haze{position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(210,244,252,.07),transparent 18%,transparent 76%,rgba(1,18,21,.3)),radial-gradient(ellipse at 44% 100%,rgba(72,140,116,.18),transparent 42%)}

    header{height:12vh;min-height:88px;padding:0 4.2vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(222,249,246,.1);background:linear-gradient(180deg,rgba(3,25,30,.2),transparent)}
    .brand h1{margin:0;font-size:clamp(22px,1.55vw,30px);font-weight:400;letter-spacing:.36em;color:#f8fff7;text-shadow:0 0 28px rgba(190,239,241,.18)}
    .brand p{margin:7px 0 0;color:rgba(192,235,238,.68);font-family:Georgia,serif;font-size:9px;letter-spacing:.48em}
    .tabs{display:flex;align-items:stretch;gap:34px}
    .tab{position:relative;min-width:150px;padding:16px 12px 18px;border:0;background:transparent;color:rgba(179,221,224,.58);cursor:pointer;font-size:15px;font-weight:500;letter-spacing:.28em;transition:.3s ease}
    .tab+.tab:before{content:"";position:absolute;left:-17px;top:14px;bottom:16px;width:1px;background:linear-gradient(transparent,rgba(199,237,237,.28),transparent)}
    .tab:after{content:"";position:absolute;left:50%;right:50%;bottom:5px;height:2px;background:linear-gradient(90deg,transparent,#d9fff2 46%,transparent);box-shadow:0 0 13px rgba(199,249,241,.75);transition:.35s ease}
    .tab:hover{color:#effff8}.tab.active{color:#fffef0;text-shadow:0 0 18px rgba(223,255,245,.22)}.tab.active:after{left:9%;right:9%}
    .tab:disabled{cursor:not-allowed;opacity:.48}

    .stage{position:relative;height:88vh;padding:3.2vh 3.4vw 3.8vh;display:grid;grid-template-columns:minmax(330px,31.5%) minmax(0,1fr);gap:3.2vw;align-items:stretch}
    .poster-column{position:relative;min-width:0;height:100%;display:flex;align-items:stretch;justify-content:center}
    .poster-frame{position:relative;width:100%;height:100%;overflow:hidden;border-radius:48% 48% 26px 26px / 24% 24% 26px 26px;background:#173d39;box-shadow:0 30px 90px rgba(0,13,17,.35),0 0 65px rgba(158,219,212,.08);isolation:isolate}
    .poster-frame:before{content:"";position:absolute;inset:0;z-index:2;border:1px solid rgba(221,252,247,.24);border-radius:inherit;box-shadow:inset 0 0 60px rgba(3,26,31,.25);pointer-events:none}
    .poster-frame:after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(225,250,255,.06),transparent 15%,transparent 75%,rgba(4,28,27,.1));pointer-events:none}
    .poster-frame img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 47%;filter:saturate(.97) contrast(1.03) brightness(1.02);transform:scale(1.006)}
    .poster-orbit{position:absolute;inset:-12px;z-index:-1;border-radius:48% 48% 36px 36px / 24% 24% 36px 36px;background:radial-gradient(ellipse at 48% 13%,rgba(212,247,247,.14),transparent 56%);filter:blur(12px)}

    .content{min-width:0;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:2vh}
    .round-head{min-height:74px;padding:0 .6vw;display:flex;align-items:flex-end;justify-content:space-between}
    .round-kicker{color:rgba(159,220,225,.72);font-size:10px;letter-spacing:.58em}
    .round-title{margin:8px 0 0;font-size:clamp(30px,2.35vw,46px);font-weight:400;letter-spacing:.24em;line-height:1}
    .round-meta{text-align:right;color:rgba(170,218,219,.68);font-size:10px;letter-spacing:.26em}.round-meta b{display:block;margin-bottom:5px;color:#fffdea;font-family:Georgia,serif;font-size:31px;font-weight:400;letter-spacing:.04em}.round-meta b em{font-family:"PingFang SC",sans-serif;font-size:13px;font-style:normal;color:#a9d9d2}

    .panel{position:relative;min-height:0;overflow:hidden;border:1px solid rgba(203,240,237,.14);border-radius:34px;background:linear-gradient(145deg,rgba(30,91,91,.5),rgba(4,31,37,.78));box-shadow:0 32px 90px rgba(0,12,16,.35),inset 0 1px rgba(255,255,255,.06);backdrop-filter:blur(24px) saturate(1.08);display:grid;grid-template-rows:auto minmax(0,1fr)}
    .panel:before{content:"";position:absolute;inset:-30% 30% 58% -12%;background:radial-gradient(ellipse,rgba(174,229,226,.16),transparent 66%);pointer-events:none}
    .control{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:2.5vw;align-items:center;padding:2.8vh 2.8vw;border-bottom:1px solid rgba(208,244,241,.1)}
    .prize-label{color:rgba(158,220,224,.82);font-size:11px;font-weight:500;letter-spacing:.42em}
    .step-label{display:inline-block;margin-left:14px;padding-left:14px;border-left:1px solid rgba(196,235,234,.23);color:rgba(194,229,229,.6);font-size:10px;letter-spacing:.2em}
    .prize-name{position:relative;margin-top:14px;padding:0 0 15px;font-size:clamp(20px,1.55vw,30px);font-weight:500;line-height:1.45;letter-spacing:.05em;color:#fffef0;text-shadow:0 0 22px rgba(207,247,237,.2)}
    .prize-name:after{content:"";position:absolute;left:0;bottom:0;width:min(86%,520px);height:2px;background:linear-gradient(90deg,transparent 0,#e9ffe9 38%,rgba(153,213,198,.45) 72%,transparent);box-shadow:0 0 13px rgba(196,245,226,.65)}
    .action{text-align:center}
    .draw-button{position:relative;width:100%;height:72px;border:1px solid rgba(249,255,238,.82);border-radius:999px;background:linear-gradient(135deg,#fffde9 0%,#d8efc3 46%,#91d1c9 100%);color:#0a3440;cursor:pointer;font-size:22px;font-weight:600;letter-spacing:.24em;box-shadow:0 12px 38px rgba(121,206,196,.2),inset 0 1px rgba(255,255,255,.92);transition:.3s ease;animation:buttonBreath 3s ease-in-out infinite}
    .draw-button:after{content:"";position:absolute;inset:4px;border:1px solid rgba(255,255,255,.45);border-radius:inherit}
    .draw-button:hover{filter:brightness(1.05);transform:translateY(-2px)}.draw-button:disabled{cursor:not-allowed;opacity:.55;animation:none}
    .hint{margin-top:10px;color:rgba(151,202,205,.65);font-size:9px;letter-spacing:.25em}
    @keyframes buttonBreath{0%,100%{box-shadow:0 12px 38px rgba(121,206,196,.19),0 0 0 rgba(213,250,231,0),inset 0 1px rgba(255,255,255,.92)}50%{box-shadow:0 14px 44px rgba(121,206,196,.3),0 0 25px rgba(213,250,231,.14),inset 0 1px white}}

    .body{position:relative;min-height:0;overflow:hidden}
    .visual{position:absolute;inset:0;opacity:1;transition:opacity .35s ease;overflow:hidden;background:radial-gradient(ellipse at 50% 68%,rgba(116,178,137,.12),transparent 46%),linear-gradient(180deg,rgba(1,20,27,.06),rgba(1,18,23,.34))}
    .visual.hidden{opacity:0;pointer-events:none}
    canvas{display:block;width:100%;height:100%}
    .visual-copy{position:absolute;left:50%;bottom:4.8%;transform:translateX(-50%);text-align:center;pointer-events:none;white-space:nowrap;color:rgba(239,255,236,.9);font-size:13px;font-weight:400;letter-spacing:.34em;text-shadow:0 0 22px rgba(173,238,209,.62)}
    .visual-copy small{display:block;margin-top:8px;color:rgba(153,211,207,.62);font-family:Georgia,serif;font-size:8px;letter-spacing:.48em}

    .results{position:absolute;inset:0;padding:2.6vh 2.6vw 2.8vh;overflow:auto;opacity:0;pointer-events:none;transition:opacity .35s ease;background:linear-gradient(180deg,rgba(3,28,34,.2),rgba(1,21,27,.52))}
    .results.show{opacity:1;pointer-events:auto}
    .result-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.8vh}.result-head h3{margin:0;font-size:18px;font-weight:500;letter-spacing:.28em}.result-tools{display:flex;align-items:center;gap:12px}.text-button{padding:5px;border:0;background:transparent;color:rgba(166,213,213,.7);cursor:pointer;font-size:10px;letter-spacing:.18em}.text-button:hover{color:#f4fff5}.status{padding:7px 12px;border:1px solid rgba(170,225,219,.22);border-radius:999px;color:#b8dedb;font-size:9px;letter-spacing:.18em}.status.done{border-color:rgba(219,218,152,.42);color:#fff3be}
    .current-winner{display:grid;grid-template-columns:minmax(190px,30%) minmax(0,1fr);gap:24px;align-items:center;margin-bottom:2vh;padding:2.4vh 1.7vw;border:1px solid rgba(204,240,229,.16);border-radius:20px;background:linear-gradient(135deg,rgba(115,170,125,.16),rgba(8,42,46,.36));box-shadow:inset 0 1px rgba(255,255,255,.04);animation:bloom .7s cubic-bezier(.16,.9,.25,1) both}
    .seat{color:#fffde6;font-family:Georgia,"PingFang SC",sans-serif;font-size:clamp(26px,2.1vw,41px);font-weight:400;letter-spacing:.04em;text-shadow:0 0 24px rgba(232,246,192,.32)}
    .winner-prize{padding-left:22px;border-left:1px solid rgba(206,238,225,.16)}.winner-prize small{display:block;margin-bottom:7px;color:#9ccbc6;font-size:9px;letter-spacing:.28em}.winner-prize b{font-size:clamp(15px,1.1vw,22px);font-weight:500;line-height:1.45;color:#f7fff5}
    .history-title{margin:0 0 12px;color:rgba(156,209,207,.75);font-size:10px;font-weight:500;letter-spacing:.35em}.history{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.history-item{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px;border:1px solid rgba(178,224,219,.1);border-radius:14px;background:rgba(2,26,32,.28)}.history-index{display:grid;place-items:center;width:34px;height:34px;border:1px solid rgba(190,229,219,.18);border-radius:50%;font-family:Georgia,serif;color:#cce6d9;font-size:12px}.history-item b{display:block;color:#fffbea;font-size:15px;font-weight:500;letter-spacing:.04em}.history-item span{display:block;margin-top:4px;color:rgba(181,217,214,.65);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    @keyframes bloom{from{opacity:0;transform:translateY(22px) scale(.93);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}

    .step-strip{position:absolute;z-index:3;right:2.5vw;bottom:2.4vh;display:flex;gap:7px;pointer-events:none}.step-dot{width:7px;height:7px;border:1px solid rgba(192,229,224,.36);border-radius:50%;background:transparent}.step-dot.done{background:#dceec1;border-color:#dceec1;box-shadow:0 0 9px rgba(218,241,198,.55)}.step-dot.current{border-color:#efffe9;box-shadow:0 0 10px rgba(222,255,229,.48)}

    @media(max-width:1420px){
      .stage{grid-template-columns:minmax(300px,29%) minmax(0,1fr);gap:2.6vw;padding-left:2.8vw;padding-right:2.8vw}.control{grid-template-columns:minmax(0,1fr) 260px}.draw-button{height:64px;font-size:19px}.history-item{padding:9px 11px}.poster-frame img{object-position:center 46%}
    }

    /* 自然生长舞台：弱化工具卡片感，增加空气、薄雾与层次 */
    .app{background:linear-gradient(138deg,#82bfd3 0%,#4b8f9b 25%,#1b5b55 52%,#082d31 76%,#041c24 100%)}
    .ambient{opacity:.48;filter:blur(46px) saturate(.78) brightness(.62);animation:ambientDrift 18s ease-in-out infinite alternate}
    .veil{background:radial-gradient(ellipse at 22% 17%,rgba(231,251,255,.22),transparent 32%),radial-gradient(ellipse at 56% 82%,rgba(166,205,143,.12),transparent 38%),linear-gradient(90deg,rgba(4,35,40,.05),rgba(4,37,39,.42) 42%,rgba(2,20,28,.9) 100%)}
    .haze{background:linear-gradient(180deg,rgba(238,255,254,.05),transparent 17%,transparent 72%,rgba(1,17,22,.24)),radial-gradient(ellipse at 55% 100%,rgba(110,171,133,.16),transparent 44%)}
    header{border-bottom-color:rgba(221,247,243,.07)}
    .brand h1{font-weight:350;letter-spacing:.32em;text-shadow:0 0 36px rgba(218,252,242,.16)}
    .tab{font-weight:400;color:rgba(202,231,229,.56)}.tab.active{color:#fffde9}
    .poster-frame{box-shadow:0 34px 110px rgba(0,16,20,.28),0 0 85px rgba(186,229,213,.09)}
    .poster-frame:before{border-color:rgba(233,255,247,.16);box-shadow:inset 0 0 70px rgba(4,30,32,.14)}
    .poster-frame img{filter:saturate(.92) contrast(1.01) brightness(1.035)}
    .round-title{font-weight:350;text-shadow:0 0 34px rgba(215,251,236,.14)}
    .panel{border-color:rgba(212,241,233,.075);border-radius:42px;background:linear-gradient(150deg,rgba(49,108,102,.31),rgba(7,42,43,.56) 42%,rgba(3,27,34,.72));box-shadow:0 36px 110px rgba(0,12,17,.28),inset 0 1px rgba(255,255,255,.035);backdrop-filter:blur(32px) saturate(1.14)}
    .panel:before{inset:-35% 28% 53% -13%;background:radial-gradient(ellipse,rgba(210,242,223,.13),transparent 68%)}
    .panel:after{content:"";position:absolute;inset:1px;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 90px rgba(2,25,28,.12)}
    .control{border-bottom:0;background:linear-gradient(180deg,rgba(218,245,230,.025),transparent);position:relative}
    .control:after{content:"";position:absolute;left:3.2vw;right:3.2vw;bottom:0;height:1px;background:linear-gradient(90deg,transparent,rgba(201,238,227,.15),transparent)}
    .prize-label{color:rgba(190,229,222,.72)}.step-label{color:rgba(203,231,226,.48)}
    .prize-name{font-weight:450;text-shadow:0 0 28px rgba(222,250,230,.16)}
    .prize-name:after{height:1px;background:linear-gradient(90deg,transparent,#efffdc 36%,rgba(155,210,184,.34) 70%,transparent);box-shadow:0 0 11px rgba(216,249,214,.48)}
    .draw-button{height:68px;border-color:rgba(255,255,237,.65);background:linear-gradient(135deg,#fffef0 0%,#e6f2cc 46%,#9fd5c8 100%);font-size:21px;font-weight:550;box-shadow:0 12px 42px rgba(118,190,172,.17),inset 0 1px rgba(255,255,255,.9)}
    .draw-button:after{inset:5px;border-color:rgba(255,255,255,.3)}
    .visual{background:radial-gradient(ellipse at 50% 72%,rgba(140,190,142,.1),transparent 44%),radial-gradient(ellipse at 50% 0%,rgba(180,226,224,.035),transparent 48%),linear-gradient(180deg,rgba(3,25,30,.025),rgba(2,21,27,.23))}
    .visual-copy{font-weight:350;color:rgba(247,255,233,.86);text-shadow:0 0 24px rgba(193,238,199,.48)}
    .results{background:radial-gradient(ellipse at 24% 10%,rgba(158,207,174,.08),transparent 42%),linear-gradient(180deg,rgba(4,33,36,.12),rgba(2,24,29,.4))}
    .current-winner{border-color:rgba(220,242,223,.1);border-radius:24px;background:linear-gradient(135deg,rgba(127,175,126,.12),rgba(9,45,46,.25));box-shadow:0 22px 60px rgba(0,19,22,.12),inset 0 1px rgba(255,255,255,.025)}
    .history-item{border-color:rgba(197,228,219,.07);background:linear-gradient(135deg,rgba(33,78,72,.18),rgba(2,27,32,.2))}
    @keyframes ambientDrift{from{transform:scale(1.12) translate3d(-.5%,0,0)}to{transform:scale(1.16) translate3d(.8%,-.7%,0)}}

    /* 电影感全幅布局：海报不再使用拱门或卡片边框 */
    .stage{grid-template-columns:minmax(390px,35%) minmax(0,1fr);gap:1.4vw;padding:2.3vh 2.4vw 3vh}
    .poster-column{overflow:visible}
    .poster-orbit{inset:-4%;border-radius:0;background:radial-gradient(ellipse at 50% 46%,rgba(190,229,226,.13),transparent 69%);filter:blur(24px)}
    .poster-frame{width:100%;height:100%;overflow:hidden;border-radius:0;background:transparent;box-shadow:none;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 5%,#000 91%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 4%,#000 94%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent 0,#000 5%,#000 91%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 4%,#000 94%,transparent 100%);mask-composite:intersect}
    .poster-frame:before{display:none}.poster-frame:after{z-index:2;background:linear-gradient(90deg,rgba(11,45,47,.16),transparent 14%,transparent 78%,rgba(7,35,37,.28)),linear-gradient(180deg,rgba(227,249,249,.035),transparent 70%,rgba(4,31,31,.1))}
    .poster-frame img{transform:scale(1.025);object-position:center 48%;filter:saturate(.94) contrast(1.02) brightness(1.045)}
    .content{gap:1.6vh}.round-head{padding-left:1.6vw;padding-right:.7vw}
    .panel{border:0;border-radius:0;background:radial-gradient(ellipse at 18% 0%,rgba(113,180,162,.14),transparent 42%),linear-gradient(155deg,rgba(23,77,75,.22),rgba(3,30,37,.5));box-shadow:none;backdrop-filter:blur(30px) saturate(1.12)}
    .panel:after{inset:0;border-radius:0;box-shadow:inset 0 1px rgba(225,249,239,.08),inset 0 -1px rgba(181,224,212,.055)}
    .panel:before{inset:-35% 24% 52% -15%;opacity:.75}
    .control{padding:2.6vh 3.2vw 2.9vh}.control:after{left:2vw;right:2vw;background:linear-gradient(90deg,transparent,rgba(214,241,229,.13) 18%,rgba(214,241,229,.13) 82%,transparent)}
    .body{margin:0 1vw 1vh;background:radial-gradient(ellipse at 50% 56%,rgba(91,157,117,.055),transparent 58%)}
    .visual{background:radial-gradient(ellipse at 50% 60%,rgba(113,174,125,.09),transparent 47%),linear-gradient(180deg,rgba(1,20,26,.01),rgba(1,19,25,.18))}

    /* 结果公示：座位号与奖品双重点舞台 */
    .results{padding:3.1vh 3vw max(5vh,72px);scroll-padding-bottom:90px;scrollbar-gutter:stable;background:radial-gradient(ellipse at 18% 12%,rgba(166,210,166,.09),transparent 42%),linear-gradient(180deg,rgba(3,31,34,.08),rgba(2,24,30,.32))}
    .result-head{margin-bottom:2.4vh}.result-head h3{font-size:24px;font-weight:550;letter-spacing:.32em;color:#f8fff3;text-shadow:0 0 24px rgba(210,246,221,.18)}
    .text-button{font-size:12px;letter-spacing:.16em}.status{padding:9px 16px;font-size:11px}
    .current-winner{position:relative;display:grid;grid-template-columns:minmax(300px,42%) minmax(0,1fr);gap:0;align-items:stretch;margin-bottom:2.8vh;padding:0;border:0;border-radius:0;background:linear-gradient(100deg,rgba(172,203,151,.13),rgba(40,104,88,.1) 46%,rgba(3,29,35,.02));box-shadow:none;overflow:hidden}
    .current-winner:before,.current-winner:after{content:"";position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(224,243,198,.34) 20%,rgba(189,230,211,.12) 75%,transparent)}.current-winner:before{top:0}.current-winner:after{bottom:0}
    .winner-seat{position:relative;padding:3.3vh 2.5vw 3.5vh}.winner-seat:after{content:"";position:absolute;right:0;top:19%;bottom:19%;width:1px;background:linear-gradient(transparent,rgba(207,235,218,.28),transparent)}
    .winner-seat small,.winner-prize small{display:block;margin-bottom:12px;color:#a7d2ca;font-size:12px;font-weight:500;letter-spacing:.28em}
    .seat{display:flex;align-items:baseline;gap:12px;color:#fffce7;font-family:"PingFang SC","苹方-简","Microsoft YaHei",sans-serif;font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 0 28px rgba(239,247,194,.22)}
    .seat-area{font-size:clamp(22px,1.45vw,29px);font-weight:450;letter-spacing:.04em;white-space:nowrap}.seat-code{font-size:clamp(46px,3.25vw,66px);font-weight:430;letter-spacing:.02em}
    .winner-prize{position:relative;display:flex;flex-direction:column;justify-content:center;padding:3.1vh 2.8vw;border:0}.winner-prize b{max-width:760px;color:#fffef0;font-size:clamp(22px,1.65vw,32px);font-weight:560;line-height:1.5;letter-spacing:.035em;text-shadow:0 0 25px rgba(226,249,218,.17)}.winner-prize em{margin-top:10px;color:rgba(153,204,195,.46);font-family:Georgia,serif;font-size:9px;font-style:normal;letter-spacing:.32em}

    /* 海报同源雾蓝视觉：去除绿调与四周蒙版，只在右侧自然融入舞台 */

    .panel:before{background:radial-gradient(ellipse,rgba(174,217,237,.14),transparent 68%)}.panel:after{box-shadow:inset 0 1px rgba(222,242,251,.09),inset 0 -1px rgba(164,210,231,.055)}

    .prize-name{color:#fffdf1;text-shadow:0 0 28px rgba(196,229,245,.18)}.prize-name:after{background:linear-gradient(90deg,transparent,#e4f6ff 36%,rgba(138,194,220,.42) 72%,transparent);box-shadow:0 0 12px rgba(177,221,242,.56)}

    /* 统一雾蓝舞台：顶部与页面连续，不再使用独立深色横条 */

    .tab:after,.prize-name:after{height:2px;border:0;border-radius:999px;background:var(--ice-line-gradient);box-shadow:none;filter:none}
    .tab:after{bottom:5px}.tab.active:after{left:16%;right:16%}

    /* 左右靠统一色域和留白融合，不再使用连接弧线或双层轮廓 */
    .stage{grid-template-columns:minmax(410px,35%) minmax(0,1fr);gap:2.2vw;padding:2.4vh 3vw 3.2vh;min-height:0;overflow:hidden}

    .poster-frame{width:100%;height:100%;min-height:0;overflow:hidden;background:#285b74;border:0;border-radius:32px 104px 32px 32px/32px 86px 32px 32px;-webkit-mask-image:none!important;mask-image:none!important;box-shadow:0 30px 76px rgba(3,19,32,.27),16px 6px 46px rgba(102,168,197,.07)}

      ctx.strokeStyle=trunk;ctx.lineWidth=Math.max(10,scale*.032);ctx.beginPath();ctx.moveTo(cx-4+sway*.25,H*.408);ctx.bezierCurveTo(cx-8+sway,H*.355,cx-W*.033,H*.31,cx-W*.064+sway,H*.258);ctx.stroke();ctx.beginPath();ctx.moveTo(cx+4+sway*.25,H*.408);ctx.bezierCurveTo(cx+9+sway,H*.35,cx+W*.035,H*.30,cx+W*.061+sway,H*.246);ctx.stroke();
      ctx.strokeStyle='rgba(211,238,249,.22)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx-4+sway*.25,H*.398);ctx.bezierCurveTo(cx-10+sway,H*.35,cx-W*.035,H*.305,cx-W*.061+sway,H*.261);ctx.stroke();ctx.beginPath();ctx.moveTo(cx+4+sway*.25,H*.398);ctx.bezierCurveTo(cx+10+sway,H*.345,cx+W*.035,H*.298,cx+W*.058+sway,H*.25);ctx.stroke();
      ctx.strokeStyle='rgba(208,236,248,.31)';ctx.lineWidth=1.1;ctx.beginPath();ctx.moveTo(cx-4,ground-8);ctx.bezierCurveTo(cx-8,H*.62,cx+2,H*.46,cx+sway,H*.375);ctx.stroke();
      const branches=[
        {sy:.61,ex:-.38,ey:.43,c1:-.10,c1y:.55,c2:-.24,c2y:.48,w:9.2},{sy:.565,ex:.40,ey:.41,c1:.12,c1y:.52,c2:.27,c2y:.46,w:8.8},
        {sy:.49,ex:-.31,ey:.30,c1:-.09,c1y:.43,c2:-.20,c2y:.36,w:7.2},{sy:.455,ex:.32,ey:.285,c1:.09,c1y:.40,c2:.22,c2y:.33,w:6.8},
        {sy:.405,ex:-.20,ey:.20,c1:-.055,c1y:.34,c2:-.14,c2y:.26,w:10.8},{sy:.405,ex:.19,ey:.185,c1:.055,c1y:.34,c2:.13,c2y:.23,w:10.2}
      ];
      branches.forEach((b,i)=>{const sy=H*b.sy;ctx.strokeStyle=`rgba(73,119,145,${.42+i*.022})`;ctx.lineWidth=Math.max(2,b.w*scale/620);ctx.beginPath();ctx.moveTo(cx+(i%2?sway*.4:-sway*.25),sy);ctx.bezierCurveTo(cx+W*b.c1,H*b.c1y,cx+W*b.c2,H*b.c2y,cx+W*b.ex,H*b.ey);ctx.stroke();ctx.strokeStyle='rgba(210,237,248,.12)';ctx.lineWidth=.75;ctx.stroke();
        const ex=cx+W*b.ex,ey=H*b.ey,dir=Math.sign(b.ex);ctx.strokeStyle='rgba(128,183,207,.23)';ctx.lineWidth=Math.max(1.1,b.w*scale/1300);[-1,1].forEach((s,j)=>{ctx.beginPath();ctx.moveTo(ex-dir*W*.035,ey+H*.025);ctx.quadraticCurveTo(ex+dir*W*.012,ey-H*(.018+j*.012),ex+dir*W*.055,ey-H*(.045+s*.018));ctx.stroke()})});
      ctx.globalCompositeOperation='source-over';const canopy=[[-.34,.12,.28,.19],[-.18,-.04,.31,.22],[.02,-.12,.34,.24],[.23,-.03,.31,.22],[.39,.13,.25,.18],[-.29,.28,.3,.2],[-.06,.24,.34,.22],[.2,.25,.34,.22],[.39,.29,.22,.16]];canopy.forEach((b,i)=>{const x=cx+b[0]*crownW,y=crownY+b[1]*crownH,rx=b[2]*crownW,ry=b[3]*crownH,g=ctx.createRadialGradient(x-rx*.18,y-ry*.22,2,x,y,rx);g.addColorStop(0,`rgba(92,158,189,${.21+(i%3)*.018})`);g.addColorStop(.62,'rgba(35,91,122,.2)');g.addColorStop(1,'rgba(13,48,72,0)');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,rx,ry,Math.sin(i*1.7)*.08,0,Math.PI*2);ctx.fill()});
      const glows=[[-.26,.04,.31],[.25,.04,.32],[-.04,-.15,.36],[-.44,.18,.23],[.43,.17,.24],[.03,.23,.35],[-.18,.26,.24],[.18,.28,.24]];ctx.globalCompositeOperation='lighter';glows.forEach((b,i)=>{const bx=cx+b[0]*crownW,by=crownY+b[1]*crownH,br=crownW*b[2],g=ctx.createRadialGradient(bx-br*.16,by-br*.1,2,bx,by,br);g.addColorStop(0,`rgba(147,205,229,${.13+(i%3)*.013})`);g.addColorStop(.48,'rgba(61,131,163,.1)');g.addColorStop(1,'rgba(16,59,84,0)');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(bx,by,br,crownH*(.24+(i%3)*.035),Math.sin(i)*.06,0,Math.PI*2);ctx.fill()});
      leafDust.forEach((p,i)=>{const a=p.a+Math.sin(t*.28+p.s)*.014,r=p.r,x=cx+Math.cos(a)*crownW*.48*r,y=crownY+Math.sin(a)*crownH*.47*r,alpha=.115+(i%6)*.019+.028*Math.sin(t*.8+p.s);leafShape(x,y,9.2*p.size,3.8*p.size,p.rot+Math.sin(t*.35+p.s)*.11,alpha,i%7===0)});ctx.restore();
      return{cx,crownY,crownW,crownH,ground};
    }
    function drawIdle(now){const t=(now-modeStart)/1000,{cx,crownY,crownW,crownH}=drawTree(t);ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.globalCompositeOperation='lighter';labels.forEach((p,i)=>{const x=cx+p.nx*crownW*.45+Math.sin(t*.34+p.seed)*1.1,y=crownY+p.ny*crownH*.43+Math.cos(t*.31+p.seed)*1.1,alpha=.5+.25*Math.sin(t*.72+p.seed)**2;const fontSize=i%8===0?9.4:8.1;ctx.font=`500 ${fontSize}px "PingFang SC",sans-serif`;const w=ctx.measureText(p.label).width+14;leafShape(x,y,w,7,p.nx*.1,alpha*.15,i%8===0);ctx.fillStyle=`rgba(232,248,255,${alpha})`;ctx.fillText(p.label,x,y)});ctx.restore()}
    function clamp(v,a=0,b=1){return Math.max(a,Math.min(b,v))}
    function ease(v){v=clamp(v);return v*v*(3-2*v)}
    function drawLeafVortex(now){const t=(now-modeStart)/1000,{cx,crownY,crownW,crownH}=drawTree(t);ctx.save();ctx.globalCompositeOperation='lighter';for(let i=0;i<7;i++){const y=crownY-crownH*.31+i*crownH*.105,amp=crownW*(.2+i*.025),drift=Math.sin(t*1.15+i*.8)*crownW*.035;ctx.beginPath();ctx.moveTo(cx-amp+drift,y);ctx.bezierCurveTo(cx-amp*.35,y-crownH*.1,cx+amp*.28,y+crownH*.1,cx+amp+drift,y-crownH*.015);ctx.strokeStyle=`rgba(184,225,243,${.035+i*.008})`;ctx.lineWidth=.6+(i%2)*.25;ctx.stroke()}ctx.textAlign='center';ctx.textBaseline='middle';labels.forEach((p,i)=>{const layer=i%4,dir=i%2?-1:1,a=p.angle+t*(.78+layer*.09)*dir,rx=crownW*(.24+layer*.06),ry=crownH*(.32+(i%3)*.07),z=(Math.sin(a)+1)/2,x=cx+Math.cos(a)*rx,y=crownY+Math.sin(a)*ry+Math.sin(t*1.8+p.seed)*4,scale=.78+z*.32;const fontSize=(i%8===0?9.5:8.1)*scale;ctx.font=`500 ${fontSize}px "PingFang SC",sans-serif`;const w=(ctx.measureText(p.label).width+15)*scale,ang=Math.atan2(Math.cos(a)*ry,-Math.sin(a)*rx);leafShape(x,y,w,7.6*scale,ang,0.17+.23*z,i%9===0);ctx.fillStyle=`rgba(239,251,255,${.54+.44*z})`;ctx.fillText(p.label,x,y)});for(let i=0;i<52;i++){const layer=i%6,a=t*(.9+layer*.05)*(i%2?-1:1)+i*.57,rx=crownW*(.21+layer*.052),ry=crownH*(.29+(i%4)*.07),x=cx+Math.cos(a)*rx,y=crownY+Math.sin(a)*ry,w=6+(i%5)*1.45;leafShape(x,y,w,3+(i%3),a+Math.PI/2,.08+(i%6)*.019,i%11===0)}ctx.restore()}
    function drawReveal(now){
      const t=(now-modeStart)/1000,cx=W/2,cy=H*.46,k=Math.min(1,t/.85),s=1+k*.4;
      ctx.save();ctx.globalCompositeOperation='lighter';
      glowCircle(cx,cy,Math.min(W,H)*(.13+k*.18),`rgba(188,229,247,${.3*(1-k)})`);
      leafShape(cx,cy,98*s,44*s,-Math.PI/2,1-k*.4,true);
      ctx.restore()
    }
    function animate(now){ctx.clearRect(0,0,W,H);if(mode==='idle')drawIdle(now);else if(mode==='vortex')drawLeafVortex(now);else drawReveal(now);requestAnimationFrame(animate)}
    function setMode(next){mode=next;modeStart=performance.now();if(next==='idle'){$('visualCopy').textContent='在流动的世界里，做一棵静默生长的树';$('visualEnglish').textContent='ROOTED TOGETHER · GROWING TOGETHER'}else if(next==='vortex'){$('visualCopy').textContent='风起叶旋 · 喊停即定格';$('visualEnglish').textContent='LET THE LEAVES TURN · STOP ON LUCK'}else{$('visualCopy').textContent='幸运在枝头生长';$('visualEnglish').textContent='LUCK TAKES ROOT HERE'}}

    function startOrContinue(){
      if(state.revealing||isRoundComplete())return;
      if(state.running){finishDraw();return}
      state.running=true;$('visual').classList.remove('hidden');$('results').classList.remove('show');$('drawButton').disabled=false;$('drawButton').textContent='结束抽奖';$('hint').textContent='叶片旋转中，艺人喊停后再次点击';setTabsDisabled(true);buildIdleScene();setMode('vortex')
    }
    function finishDraw(){
      state.running=false;state.revealing=true;$('drawButton').disabled=true;
      const r=state.activeRound,prize=ROUNDS[r].prizes[state.results[r].length],winner=pickWinner();state.results[r].push({seat:winner,prize});save();setMode('reveal');
      setTimeout(()=>{state.revealing=false;setTabsDisabled(false);render()},900)
    }
    function switchRound(r){if(state.running||state.revealing)return;state.activeRound=r;setMode('idle');render()}
    function resetRound(){if(state.running||state.revealing||!state.results[state.activeRound].length)return;if(!confirm(`确定清空${ROUNDS[state.activeRound].title}的全部中奖结果吗？`))return;state.results[state.activeRound]=[];save();setMode('idle');render()}
    function resetAll(){if(state.running||state.revealing||(!state.results[0].length&&!state.results[1].length))return;if(!confirm('确定清空七次抽奖的全部中奖结果吗？'))return;state.results=[[],[]];save();setMode('idle');render()}
    document.querySelectorAll('.tab').forEach(x=>x.addEventListener('click',()=>switchRound(Number(x.dataset.round))));
    $('drawButton').addEventListener('click',startOrContinue);$('resetRound').addEventListener('click',resetRound);$('resetAll').addEventListener('click',resetAll);
    addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!e.target.closest('button')){e.preventDefault();startOrContinue()}});
    addEventListener('resize',resize);new ResizeObserver(resize).observe($('visual'));requestAnimationFrame(animate);resize();setMode('idle');render();
